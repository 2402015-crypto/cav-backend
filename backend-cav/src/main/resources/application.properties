spring.application.name=backend-cav
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cav?serverTimezone=${APP_TIME_ZONE:America/Cancun}&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:America/Cancun}

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.time-zone=${APP_TIME_ZONE:America/Cancun}
app.ocr.base-url=${OCR_BASE_URL:http://localhost:5000}
app.ocr.connect-timeout-ms=${OCR_CONNECT_TIMEOUT_MS:2000}
app.ocr.read-timeout-ms=${OCR_READ_TIMEOUT_MS:10000}